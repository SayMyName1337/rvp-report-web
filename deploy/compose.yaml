# Развёртывание «Суточного рапорта».
#
#   docker compose -f deploy/compose.yaml --env-file .env up -d --build
#
# Четыре службы: база, приложение, фоновые задачи и nginx с TLS.
# Наружу смотрит только nginx; приложение и база доступны лишь внутри
# сети контейнеров.

name: rvp-report

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
      - ./backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Порт наружу не пробрасывается: база доступна только приложению.

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        WITH_PDF: ${WITH_PDF:-1}
    image: rvp-report:latest
    restart: unless-stopped
    command: ["web"]
    env_file: [../.env]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: rvp-report:latest
    restart: unless-stopped
    command: ["worker"]
    env_file: [../.env]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media
    depends_on:
      web:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
      - ./errors:/var/www/errors:ro
      - static:/var/www/static:ro
    depends_on:
      - web

volumes:
  db:
  media:
  static:
