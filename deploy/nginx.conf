# nginx для «Суточного рапорта».
#
# Завершает TLS, отдаёт статику и проксирует остальное в приложение.
# Загруженные рапорты и собранные презентации здесь НЕ отдаются:
# они содержат коммерческую тайну и уходят только через представление
# с проверкой прав и записью в журнал выдач.

server {
    listen 80;
    server_name _;

    # Единственное, что разрешено по незащищённому протоколу, —
    # предложение перейти на защищённый.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Суточный рапорт весит около трёхсот килобайт; запас взят
    # с большим избытком, но не настолько, чтобы им злоупотребили.
    client_max_body_size 32m;

    # Разбор рапорта занимает несколько секунд, сборка презентации —
    # ещё несколько. Тайм-аут задан с запасом на медленный узел.
    proxy_connect_timeout 10s;
    proxy_read_timeout    180s;
    proxy_send_timeout    180s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
