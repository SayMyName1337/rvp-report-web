<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700"
     font-family="Segoe UI, Arial, sans-serif" role="img"
     aria-label="Схема обработки суточного рапорта от загрузки файла до доклада">
  <title>Обработка суточного рапорта</title>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00326E"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0A8F2D"/>
    </marker>
  </defs>

  <rect width="960" height="700" fill="#FFFFFF"/>

  <text x="20" y="34" font-size="19" font-weight="600" fill="#00326E">
    Обработка суточного рапорта
  </text>
  <text x="20" y="56" font-size="13" fill="#6E6E6E">
    От загруженного файла до доклада. Обработка выполняется в рамках одного запроса.
  </text>
  <line x1="20" y1="70" x2="940" y2="70" stroke="#4BAF46" stroke-width="3"/>

  <!-- 1. ФАЙЛ -->
  <rect x="30" y="110" width="200" height="70" rx="8"
        fill="#F1F4F8" stroke="#DDE3EA"/>
  <text x="130" y="138" font-size="13.5" font-weight="600" fill="#00326E"
        text-anchor="middle">Файл рапорта .xlsx</text>
  <text x="130" y="160" font-size="11.5" fill="#6E6E6E" text-anchor="middle">
    начальник ЦИТУ
  </text>

  <!-- 2. ПРОВЕРКА -->
  <rect x="290" y="110" width="220" height="70" rx="8"
        fill="#FFFFFF" stroke="#00326E" stroke-width="1.5"/>
  <text x="400" y="134" font-size="13.5" font-weight="600" fill="#00326E"
        text-anchor="middle">Проверка файла</text>
  <text x="400" y="154" font-size="11" fill="#6E6E6E" text-anchor="middle">
    имя · размер · сигнатура
  </text>
  <text x="400" y="170" font-size="11" fill="#6E6E6E" text-anchor="middle">
    структура книги · повтор
  </text>

  <!-- ОТКАЗ -->
  <rect x="290" y="218" width="220" height="52" rx="8"
        fill="#FDEDEB" stroke="#C0392B"/>
  <text x="400" y="240" font-size="12.5" font-weight="600" fill="#C0392B"
        text-anchor="middle">Отказ с указанием причины</text>
  <text x="400" y="258" font-size="11" fill="#6E6E6E" text-anchor="middle">
    данные за сутки не меняются
  </text>

  <!-- 3. СОХРАНЕНИЕ -->
  <rect x="570" y="110" width="200" height="70" rx="8"
        fill="#FFFFFF" stroke="#00326E" stroke-width="1.5"/>
  <text x="670" y="138" font-size="13.5" font-weight="600" fill="#00326E"
        text-anchor="middle">Сохранение файла</text>
  <text x="670" y="160" font-size="11.5" fill="#6E6E6E" text-anchor="middle">
    запись в истории загрузок
  </text>

  <!-- 4. РАЗБОР -->
  <rect x="290" y="320" width="480" height="120" rx="8"
        fill="#EBF0D7" stroke="#9BC855" stroke-width="1.5"/>
  <text x="310" y="346" font-size="13.5" font-weight="600" fill="#0A8F2D">
    Разбор: поиск показателей по подписям
  </text>
  <text x="310" y="368" font-size="11.5" fill="#6E6E6E">
    Блоки и столбцы отыскиваются по тексту заголовков, а не по адресам
  </text>
  <text x="310" y="384" font-size="11.5" fill="#6E6E6E">
    ячеек. Сдвиг строк и вставка столбцов на разбор не влияют.
  </text>
  <text x="310" y="408" font-size="11.5" fill="#6E6E6E">
    Не найденное по подписи берётся по эталонному адресу, сутки
  </text>
  <text x="310" y="424" font-size="11.5" fill="#6E6E6E">
    помечаются как требующие подтверждения.
  </text>

  <!-- ПОПРАВКИ -->
  <rect x="30" y="330" width="210" height="100" rx="8"
        fill="#FFFFFF" stroke="#0A8F2D" stroke-dasharray="5 4"/>
  <text x="135" y="356" font-size="12.5" font-weight="600" fill="#0A8F2D"
        text-anchor="middle">Поправки разметки</text>
  <text x="135" y="378" font-size="11" fill="#6E6E6E" text-anchor="middle">
    задаются оператором,
  </text>
  <text x="135" y="394" font-size="11" fill="#6E6E6E" text-anchor="middle">
    когда подпись в рапорте
  </text>
  <text x="135" y="410" font-size="11" fill="#6E6E6E" text-anchor="middle">
    изменили
  </text>

  <!-- 5. ЗАПИСЬ -->
  <rect x="290" y="490" width="480" height="120" rx="8"
        fill="#FFFFFF" stroke="#00326E" stroke-width="1.5"/>
  <text x="310" y="516" font-size="13.5" font-weight="600" fill="#00326E">
    Запись в базу данных одной транзакцией
  </text>
  <text x="310" y="540" font-size="11.5" fill="#6E6E6E">
    Показатели суток · журнал происхождения каждого значения
  </text>
  <text x="310" y="556" font-size="11.5" fill="#6E6E6E">
    Замечания к исходным данным · справочники
  </text>
  <text x="310" y="580" font-size="11.5" fill="#6E6E6E">
    Данные за отчётную дату замещаются целиком; следом выполняется
  </text>
  <text x="310" y="596" font-size="11.5" fill="#6E6E6E">
    сопоставление со смежными сутками.
  </text>

  <!-- 6. ВЫХОД -->
  <rect x="820" y="490" width="120" height="56" rx="8"
        fill="#F1F4F8" stroke="#DDE3EA"/>
  <text x="880" y="514" font-size="12" font-weight="600" fill="#00326E"
        text-anchor="middle">Страницы</text>
  <text x="880" y="532" font-size="11" fill="#6E6E6E" text-anchor="middle">и сводки</text>

  <rect x="820" y="330" width="120" height="70" rx="8"
        fill="#F1F4F8" stroke="#DDE3EA"/>
  <text x="880" y="356" font-size="12" font-weight="600" fill="#00326E"
        text-anchor="middle">Презентация</text>
  <text x="880" y="374" font-size="11" fill="#6E6E6E" text-anchor="middle">доклада</text>
  <text x="880" y="390" font-size="11" fill="#6E6E6E" text-anchor="middle">.pptx и PDF</text>

  <!-- СВЯЗИ -->
  <line x1="230" y1="145" x2="284" y2="145" stroke="#00326E" stroke-width="2"
        marker-end="url(#a)"/>
  <line x1="510" y1="145" x2="564" y2="145" stroke="#00326E" stroke-width="2"
        marker-end="url(#a)"/>
  <text x="537" y="136" font-size="10.5" fill="#00326E" text-anchor="middle">годен</text>

  <line x1="400" y1="180" x2="400" y2="212" stroke="#C0392B" stroke-width="2"
        marker-end="url(#a)"/>
  <text x="432" y="200" font-size="10.5" fill="#C0392B">не годен</text>

  <path d="M 670 180 L 670 280 L 530 280 L 530 314" fill="none"
        stroke="#00326E" stroke-width="2" marker-end="url(#a)"/>

  <line x1="240" y1="380" x2="284" y2="380" stroke="#0A8F2D" stroke-width="2"
        stroke-dasharray="5 4" marker-end="url(#g)"/>

  <line x1="530" y1="440" x2="530" y2="484" stroke="#00326E" stroke-width="2"
        marker-end="url(#a)"/>

  <line x1="770" y1="550" x2="814" y2="550" stroke="#00326E" stroke-width="2"
        marker-end="url(#a)"/>

  <path d="M 770 380 L 814 380" fill="none" stroke="#00326E" stroke-width="2"
        marker-end="url(#a)"/>

  <!-- ПОЯСНЕНИЕ ПРО ПРЕЗЕНТАЦИЮ -->
  <rect x="30" y="470" width="210" height="140" rx="8"
        fill="#F1F4F8" stroke="#DDE3EA"/>
  <text x="46" y="496" font-size="12.5" font-weight="600" fill="#00326E">
    Презентация — из файла
  </text>
  <text x="46" y="518" font-size="11" fill="#6E6E6E">Слайды формируются</text>
  <text x="46" y="534" font-size="11" fill="#6E6E6E">разбором исходного файла,</text>
  <text x="46" y="550" font-size="11" fill="#6E6E6E">минуя базу данных.</text>
  <text x="46" y="572" font-size="11" fill="#6E6E6E">Так сведения ограниченного</text>
  <text x="46" y="588" font-size="11" fill="#6E6E6E">доступа не проходят через</text>
  <text x="46" y="604" font-size="11" fill="#6E6E6E">хранилище системы.</text>
</svg>
